<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recebimento · TechOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/techos.css" th:href="@{/css/techos.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-techos sticky-top" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#" th:href="@{/}"><span class="brand-mark">T</span>TechOS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/}">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/clientes}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/equipamentos}">Equipamentos</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/os}">Ordens de serviço</a></li>
        <li class="nav-item"><a class="nav-link active" href="#" th:href="@{/estoque}">Estoque</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-xl py-4" style="max-width:900px">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Recebimento de peças</h1>
    <a class="btn btn-outline-secondary" th:href="@{/estoque}">Voltar</a>
  </div>

  <div class="rounded p-4 text-center text-white mb-3" style="background:#198754">
    <div class="display-5 fw-bold">ENTRADA</div>
    <div>Bipe as peças que chegaram. A saída é feita pela Ordem de Serviço.</div>
    <div class="mt-2">Quantidade por bipe: <strong id="qtdAtual">1</strong></div>
  </div>

  <input type="text" id="codigo" class="form-control form-control-lg mb-3" autocomplete="off"
         placeholder="Aguardando leitura..." autofocus>

  <div id="resultado" class="alert alert-secondary text-center fs-4 mb-3">Aguardando leitura...</div>

  <h2 class="h6 text-secondary">Últimas leituras</h2>
  <ul class="list-group" id="historico"></ul>
</main>

<script>
  const campo = document.getElementById('codigo');
  const resultado = document.getElementById('resultado');
  const historico = document.getElementById('historico');
  let qtd = 1;

  // Cursor sempre no campo (a pistola só funciona com ele em foco)
  campo.focus();
  document.addEventListener('click', () => campo.focus());
  campo.addEventListener('blur', () => setTimeout(() => campo.focus(), 50));

  // Som: agudo = ok, grave = erro
  function bipe(ok) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.value = ok ? 1000 : 250;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + (ok ? 0.12 : 0.4));
    } catch (e) {}
  }

  // A pistola "digita" o código e aperta Enter
  campo.addEventListener('keydown', async (ev) => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const codigo = campo.value.trim();
    campo.value = '';
    if (!codigo) return;

    // Etiqueta de comando para quantidade maior (ex.: #QTD10). #QTD1 volta ao normal.
    const m = codigo.toUpperCase().match(/^#QTD(\d+)$/);
    if (m) {
      qtd = Math.max(1, parseInt(m[1], 10));
      document.getElementById('qtdAtual').textContent = qtd;
      bipe(true);
      return;
    }

    try {
      const resp = await fetch('/estoque/bipar', {
        method: 'POST',
        body: new URLSearchParams({ codigo: codigo, quantidade: qtd })
      });
      mostrar(await resp.json(), codigo);
    } catch (e) {
      mostrar({ ok: false, mensagem: 'Sem comunicação com o servidor.' }, codigo);
    }
  });

  function mostrar(j, codigo) {
    bipe(j.ok);
    resultado.className = 'alert text-center fs-4 mb-3 ' + (j.ok ? 'alert-success' : 'alert-danger');
    if (j.ok) {
      resultado.innerHTML = '<div class="fw-bold">' + esc(j.nome) + '</div>' +
        '<div>' + j.mensagem + ' · Estoque agora: <strong>' + j.quantidade + '</strong></div>';
    } else {
      resultado.textContent = j.mensagem;
    }

    const li = document.createElement('li');
    li.className = 'list-group-item d-flex justify-content-between';
    li.innerHTML = '<span>' + (j.ok ? '+ ' + esc(j.nome) : '✕ ' + esc(codigo)) + '</span>' +
                   '<span class="text-secondary">' + (j.ok ? j.quantidade : 'erro') + '</span>';
    historico.prepend(li);
    while (historico.children.length > 10) historico.lastChild.remove();
  }

  // Evita inserir HTML vindo do banco
  function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
