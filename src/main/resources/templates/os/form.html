<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordem de serviço · TechOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/techos.css" th:href="@{/css/techos.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-techos sticky-top" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#" th:href="@{/}"><span class="brand-mark">T</span>TechOS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/}">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/clientes}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/equipamentos}">Equipamentos</a></li>
        <li class="nav-item"><a class="nav-link active" href="#" th:href="@{/os}">Ordens de serviço</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/estoque}">Estoque</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-xl py-4">

  <div class="page-head">
    <h1 class="h3" th:text="${os.id == null} ? 'Nova ordem de serviço' : 'Editar OS #' + ${os.id}">Nova ordem de serviço</h1>
  </div>

  <div class="panel" style="max-width:720px">
    <form class="panel-body" method="post" th:action="@{/os/salvar}" th:object="${os}" novalidate>
      <input type="hidden" th:field="*{id}">

      <!-- name="equipamento.id": o Spring monta o Equipamento só com o id -->
      <div class="mb-3">
        <label class="form-label" for="equipamento">Equipamento</label>
        <select id="equipamento" name="equipamento.id" class="form-select"
                th:classappend="${#fields.hasErrors('equipamento')} ? 'is-invalid'">
          <option value="">Escolha o equipamento</option>
          <option th:each="e : ${equipamentos}" th:value="${e.id}"
                  th:text="${e.marca} + ' ' + ${e.modelo} + ' · ' + ${e.cliente.nome} + ' · série ' + ${e.numeroSerie}"
                  th:selected="${os.equipamento != null and os.equipamento.id == e.id}">Dell · Maria</option>
        </select>
        <div class="invalid-feedback" th:errors="*{equipamento}">Selecione o equipamento.</div>
        <div class="form-text">Não achou? Cadastre o equipamento antes, em Equipamentos.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="defeito">Defeito relatado pelo cliente</label>
        <textarea id="defeito" rows="3" class="form-control" th:field="*{defeito}" th:errorclass="is-invalid"></textarea>
        <div class="invalid-feedback" th:errors="*{defeito}">Descreva o defeito.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="laudo">Laudo técnico (opcional)</label>
        <textarea id="laudo" rows="3" class="form-control" th:field="*{laudo}"
                  placeholder="O que o técnico encontrou e fez"></textarea>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-7">
          <label class="form-label" for="tecnicoNome">Técnico responsável</label>
          <input type="text" id="tecnicoNome" class="form-control" th:field="*{tecnicoNome}">
        </div>
        <div class="col-12 col-sm-5">
          <label class="form-label" for="valor">Valor do serviço (R$)</label>
          <input type="number" step="0.01" min="0" id="valor" class="form-control" th:field="*{valor}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{valor}">Valor inválido.</div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Salvar OS</button>
        <a class="btn btn-outline-secondary" th:href="@{/os}">Cancelar</a>
      </div>
    </form>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
